[env]
# Personal values (NEXUS_COOKIE and so on) live in the gitignored .env file
_.file = ".env"

[tools]
cmake = "latest" # wreq builds BoringSSL with it
pinact = "latest"
rust = "latest"

[tasks.check]
description = "Format, clippy, build and tests, fast feedback before commit"
run = ["cargo fmt --check", "cargo clippy --all-targets -- -D warnings", "cargo build", "cargo test"]
