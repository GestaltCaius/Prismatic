[env]
# Personal values (NEXUS_COOKIE and so on) live in the gitignored .env file
_.file = ".env"

[tools]
cmake = "latest" # wreq builds BoringSSL with it
rust = "latest"

[tasks.check]
description = "Clippy + build + tests, fast feedback before commit"
run = ["cargo clippy --all-targets -- -D warnings", "cargo build", "cargo test"]
