name: release

# Builds optimised binaries for every supported platform and attaches them to a
# GitHub Release. Each target builds on its own native runner: wreq builds BoringSSL
# with cmake, which is the awkward part of any cross-compile.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # dry run: builds, makes the SBOM and scans, but publishes nothing

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A branch name can hold slashes, which would break the archive paths of a dry run
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dry-run' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing should not hide results for the others
      matrix:
        include:
          # ubuntu-22.04, not -latest: the binary links against the builder's glibc,
          # so building on an older image keeps it runnable on older distros.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          # macOS and Windows are pinned to the newest image: the macOS binary still targets 11.0 and
          # Windows runs any build.
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-apple-darwin
            os: macos-26-intel
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BoringSSL's assembly on Windows ARM64 only builds with clang-cl and Ninja: the Visual Studio
      # generator hands the .S files to cl.exe, which can't assemble them and then fails to link.
      - name: Use clang-cl
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CC=clang-cl" >> $env:GITHUB_ENV
          "CXX=clang-cl" >> $env:GITHUB_ENV

      # No build cache here: what this job builds is what gets shipped, and a cache can carry
      # objects from a run that is not a tagged one.
      # rust-toolchain.toml pins the channel and components, so no version here.
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      # cargo-auditable embeds the dependency list in the binary, so it can be scanned for known
      # vulnerabilities after the fact (a stripped binary does not say what is inside it).
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-auditable

      - name: Build
        run: cargo auditable build --release --locked --target ${{ matrix.target }}

      # .zip on Windows, .tar.gz elsewhere. The release profile already strips symbols.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin=prismatic
          [[ "${{ matrix.os }}" == windows-* ]] && bin=prismatic.exe
          src="target/${{ matrix.target }}/release/${bin}"
          test -f "$src" || { echo "missing binary: $src"; exit 1; }

          name="prismatic-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "$src" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"

          cd dist
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            7z a "${name}.zip" "${name}" >/dev/null
          else
            tar czf "${name}.tar.gz" "${name}"
          fi
          ls -lh "${name}".*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          # The archives only, not the folders they were made from
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release and uploads the assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-cyclonedx,osv-scanner

      # A CycloneDX list of every crate for every platform, attached to the release.
      - name: SBOM
        run: |
          cargo cyclonedx --format json --target all
          mv prismatic.cdx.json "dist/prismatic-${VERSION}.cdx.json"

      # The release is not published if a shipped binary or the SBOM has a known vulnerability.
      - name: Scan the binaries and the SBOM
        run: |
          set -euo pipefail
          mkdir scan
          for archive in dist/*.tar.gz; do tar xzf "$archive" -C scan; done
          for archive in dist/*.zip; do unzip -q "$archive" -d scan; done
          osv-scanner scan source --x-plugins rust/cargoauditable --config osv-scanner.toml -r scan
          osv-scanner scan source --config osv-scanner.toml --sbom dist/*.cdx.json

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - if: startsWith(github.ref, 'refs/tags/') # a dry run stops here
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
