name: release

# Builds optimised binaries for every supported platform and attaches them to a
# GitHub Release. Each target builds on its own native runner: wreq builds BoringSSL
# with cmake, which is the awkward part of any cross-compile.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # produce binaries without cutting a tag

permissions:
  contents: write # required to create the release and upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing should not hide results for the others
      matrix:
        include:
          # ubuntu-22.04, not -latest: the binary links against the builder's glibc,
          # so building on an older image keeps it runnable on older distros.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest # Apple silicon
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # rust-toolchain.toml pins the channel and components, so no version here.
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # .zip on Windows, .tar.gz elsewhere. The release profile already strips symbols.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin=prismatic
          [[ "${{ matrix.os }}" == windows-* ]] && bin=prismatic.exe
          src="target/${{ matrix.target }}/release/${bin}"
          test -f "$src" || { echo "missing binary: $src"; exit 1; }

          name="prismatic-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "$src" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"

          cd dist
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            7z a "${name}.zip" "${name}" >/dev/null
          else
            tar czf "${name}.tar.gz" "${name}"
          fi
          ls -lh "${name}".*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # dispatch runs build only, no release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * | tee SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
