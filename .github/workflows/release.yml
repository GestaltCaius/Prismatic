name: release

# Builds optimised binaries for every supported platform and attaches them to a
# GitHub Release. Each target builds on its own native runner: wreq builds BoringSSL
# with cmake, which is the awkward part of any cross-compile.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # produce binaries without cutting a tag

permissions:
  contents: write # required to create the release and upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing should not hide results for the others
      matrix:
        include:
          # ubuntu-22.04, not -latest: the binary links against the builder's glibc,
          # so building on an older image keeps it runnable on older distros.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest # Apple silicon
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the channel and components, so no version here.
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      # cargo-auditable embeds the dependency list in the binary, so it can be scanned for known
      # vulnerabilities after the fact (a stripped binary does not say what is inside it).
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-auditable

      - name: Build
        run: cargo auditable build --release --locked --target ${{ matrix.target }}

      # .zip on Windows, .tar.gz elsewhere. The release profile already strips symbols.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin=prismatic
          [[ "${{ matrix.os }}" == windows-* ]] && bin=prismatic.exe
          src="target/${{ matrix.target }}/release/${bin}"
          test -f "$src" || { echo "missing binary: $src"; exit 1; }

          name="prismatic-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "$src" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"

          cd dist
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            7z a "${name}.zip" "${name}" >/dev/null
          else
            tar czf "${name}.tar.gz" "${name}"
          fi
          ls -lh "${name}".*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # dispatch runs build only, no release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-cyclonedx,osv-scanner

      # A CycloneDX list of every crate for every platform, attached to the release.
      - name: SBOM
        run: |
          cargo cyclonedx --format json --target all
          mv prismatic.cdx.json "dist/prismatic-${{ github.ref_name }}.cdx.json"

      # The release is not published if a shipped binary or the SBOM has a known vulnerability.
      - name: Scan the binaries and the SBOM
        run: |
          set -euo pipefail
          mkdir scan
          for archive in dist/*.tar.gz; do tar xzf "$archive" -C scan; done
          for archive in dist/*.zip; do unzip -q "$archive" -d scan; done
          osv-scanner scan source --x-plugins rust/cargoauditable --config osv-scanner.toml -r scan
          osv-scanner scan source --config osv-scanner.toml --sbom dist/*.cdx.json

      - name: Checksums
        run: cd dist && sha256sum * | tee SHA256SUMS

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
