# Dependencies are pinned with `=` in Cargo.toml, so nothing updates unless a pull request says so.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # a freshly published version waits a week (security updates are not delayed)
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # a freshly published version waits a week (security updates are not delayed)
    groups:
      actions:
        patterns: ["*"]
