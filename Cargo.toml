[package]
name = "prismatic"
version = "0.1.0"
edition = "2021"
description = "A CLI tool for updating Stardew Valley mods."
authors = ["TheSuperGamer20578"]

[dependencies]
anyhow = { version = "1.0.82", features = ["backtrace"] }
clap = { version = "4.5.4", features = ["derive"] }
json_comments = "0.2.2"
octocrab = { version = "0.38.0", optional = true }
wreq = { version = "=0.16.1", features = ["json", "cookies", "form", "stream"] }
wreq-util = "0.2"
serde = { version = "1.0.198", features = ["derive"] }
serde_json = "1.0.116"
tokio = { version = "1.37.0", features = ["full"] }
zip = "1.1.1"
bytes = "1.6.0"
async-recursion = "1.1.0"
scraper = { version = "0.19.0", optional = true }
rookie = { version = "0.5.1", optional = true }
inquire = "=0.9.4"
indicatif = "=0.18.6"
futures-util = "=0.3.34"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
getrandom = "=0.4.3"

[features]
default = ["github", "nexus"]
github = ["dep:octocrab"]
nexus = ["dep:scraper", "dep:rookie"]

# Tuned for `cargo install --git`: smallest, fastest binary, at the cost of build time.
# `cargo build` (dev profile) is unaffected.
[profile.release]
opt-level = 3     # default for release; stated explicitly so it is not silently changed
lto = "fat"       # optimise across crate boundaries, slowest to link
codegen-units = 1 # let LLVM see the whole crate
strip = "symbols" # drop debug symbols from the shipped binary

# rustc warnings are denied through .cargo/config.toml (`-D warnings`) rather than here,
# so a newer compiler adding a warning cannot break `cargo install --git` for users.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
panic = "warn"
