[package]
name = "prismatic"
version = "0.1.0"
edition = "2021"
description = "A CLI tool for updating Stardew Valley mods."
authors = ["TheSuperGamer20578"]

[dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
bytes = "=1.12.1"
clap = { version = "=4.5.4", features = ["derive"] }
futures-util = "=0.3.34"
getrandom = "=0.4.3"
indicatif = "=0.18.6"
inquire = "=0.9.4"
json_comments = "=0.2.2"
rookie = "=0.5.6"
scraper = "=0.19.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.116"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
wreq = { version = "=0.16.1", features = ["json", "cookies", "form", "stream"] }
wreq-util = "=0.2.0"
# Mod archives are plain deflate zips, so the other decoders (zstd, lzma, AES, ...) stay out
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

# Tuned for `cargo install --git`: smallest, fastest binary, at the cost of build time.
# `cargo build` (dev profile) is unaffected.
[profile.release]
opt-level = 3     # default for release; stated explicitly so it is not silently changed
lto = "fat"       # optimise across crate boundaries, slowest to link
codegen-units = 1 # let LLVM see the whole crate
strip = "symbols" # drop debug symbols from the shipped binary

# rustc warnings are denied through .cargo/config.toml (`-D warnings`) rather than here,
# so a newer compiler adding a warning cannot break `cargo install --git` for users.
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic = "warn"
# The library is only consumed by this crate's own binary
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
